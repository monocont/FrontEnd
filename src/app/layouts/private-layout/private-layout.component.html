<div class="dashboard-layout">
  <!-- Sidebar -->
  <aside class="sidebar" [class.sidebar-hidden]="sidebarColapsado">
    <div class="sidebar-header flex items-center justify-between">
      <div class="brand">
        <img src="images/monocont.png" class="brand-icon" alt="M" />
        <span class="brand-name">MONO<span class="text-teal">CONT</span></span>
      </div>
      <!-- Botón Hamburguesa al lado derecho del logo -->
      <button
        type="button"
        (click)="toggleSidebar()"
        class="hamburger-sidebar-btn"
        title="Ocultar menú lateral"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
    <nav class="sidebar-nav">
      <a routerLink="/home/indicadores" routerLinkActive="active" class="sidebar-link">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        <span>Indicadores</span>
      </a>
      <a routerLink="/home/empresa" routerLinkActive="active" class="sidebar-link">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
        <span>Empresas</span>
      </a>
      <a routerLink="/home/contabilidad" routerLinkActive="active" class="sidebar-link">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span>Comprobantes</span>
      </a>
      <a routerLink="/home/tipo-cambio" routerLinkActive="active" class="sidebar-link">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>Tipo de Cambio</span>
      </a>
      <a routerLink="/home/visor-comprobantes" routerLinkActive="active" class="sidebar-link">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        <span>Visor Comprobantes</span>
      </a>
      <hr class="sidebar-divider" />
      <a routerLink="/home/perfil" routerLinkActive="active" class="sidebar-link">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span>Mi Perfil</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <button
        type="button"
        class="sidebar-logout-btn"
        (click)="cerrarSesion()"
        title="Cerrar sesión de forma segura"
      >
        <div class="sidebar-logout-icon">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
        </div>
        <div class="sidebar-logout-info">
          <span class="sidebar-logout-title">Cerrar Sesión</span>
          <span class="sidebar-logout-subtitle">Salir del sistema</span>
        </div>
        <svg class="w-3.5 h-3.5 opacity-40 ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="topbar">
      <div class="flex items-center gap-3">
        <!-- Botón Hamburguesa en Topbar para expandir cuando esté oculto -->
        <button
          *ngIf="sidebarColapsado"
          type="button"
          (click)="toggleSidebar()"
          class="hamburger-topbar-btn"
          title="Mostrar menú lateral"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="topbar-title">{{ tituloSeccion }}</h1>
      </div>
      <div class="topbar-right">
        <div class="user-info cursor-pointer hover:bg-slate-100 p-1.5 rounded-xl transition-colors" routerLink="/home/perfil">
          <div class="user-avatar">MR</div>
          <span class="user-name">Mi Perfil</span>
        </div>
      </div>
    </header>
    <div [class]="esVistaDetalleCompleta ? 'content-area-compact' : 'content-area'">
      <div [class]="esVistaDetalleCompleta ? 'w-full' : 'max-w-5xl mx-auto w-full'">
        <router-outlet />
      </div>
    </div>
  </main>
</div>
